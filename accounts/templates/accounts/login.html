<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OfficeGuardian - Giris</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #0c1220;
            color: #e8edf5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            -webkit-font-smoothing: antialiased;
            margin: 0;
            padding: 1rem;
        }

        .login-wrapper {
            width: 100%;
            max-width: 400px;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .brand-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, rgba(96, 165, 250, 0.15) 0%, rgba(52, 211, 153, 0.15) 100%);
            border: 1px solid rgba(96, 165, 250, 0.2);
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
        }

        .brand-icon i {
            font-size: 1.6rem;
            color: #60a5fa;
        }

        .brand-header h1 {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            margin: 0;
            color: #e8edf5;
        }

        .brand-header p {
            color: #5a6478;
            font-size: 0.85rem;
            margin: 0.4rem 0 0;
        }

        .login-card {
            background-color: #182136;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
        }

        .form-label {
            font-size: 0.82rem;
            font-weight: 500;
            color: #8b95a8;
            margin-bottom: 0.35rem;
        }

        .form-control {
            background-color: #1a2540;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e8edf5;
            border-radius: 8px;
            padding: 0.6rem 0.85rem;
            font-size: 0.88rem;
            transition: border-color 150ms ease, box-shadow 150ms ease;
        }

        .form-control:focus {
            background-color: #1a2540;
            border-color: #60a5fa;
            color: #e8edf5;
            box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.15);
        }

        .form-control::placeholder {
            color: #5a6478;
        }

        .btn-primary-custom {
            width: 100%;
            padding: 0.65rem;
            font-weight: 600;
            font-size: 0.9rem;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%);
            color: #fff;
            cursor: pointer;
            transition: all 150ms ease;
        }

        .btn-primary-custom:hover {
            background: linear-gradient(135deg, #4a93e8 0%, #2563eb 100%);
            box-shadow: 0 4px 12px rgba(96, 165, 250, 0.25);
        }

        .alert-danger {
            background-color: rgba(248, 113, 113, 0.1);
            border: 1px solid rgba(248, 113, 113, 0.2);
            color: #f87171;
            border-radius: 8px;
            font-size: 0.85rem;
            padding: 0.7rem 1rem;
        }

        .footer-link {
            text-align: center;
            margin-top: 1.5rem;
        }

        .footer-link a {
            color: #60a5fa;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: color 150ms ease;
        }

        .footer-link a:hover {
            color: #93c5fd;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="brand-header">
            <div class="brand-icon">
                <i class="bi bi-shield-check"></i>
            </div>
            <h1>OfficeGuardian</h1>
            <p>Calisan Izleme Sistemi</p>
        </div>

        <div class="login-card">
            {% if form.errors %}
            <div class="alert alert-danger mb-3">
                <i class="bi bi-exclamation-circle me-1"></i>
                Kullanici adi veya sifre hatali.
            </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Kullanici Adi</label>
                    {{ form.username }}
                </div>
                <div class="mb-4">
                    <label class="form-label">Sifre</label>
                    {{ form.password }}
                </div>
                <button type="submit" class="btn-primary-custom">Giris Yap</button>
            </form>
        </div>

        <div class="footer-link">
            <a href="{% url 'accounts:register' %}">Hesap olustur <i class="bi bi-arrow-right"></i></a>
        </div>
    </div>
</body>
</html>
